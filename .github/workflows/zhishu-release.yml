name: K图 desktop release

# K图（一键接入版）的打包：推 v{版本}-zs.{序号} 的 tag 触发，打 Windows x64、macOS Apple 芯片绿色版（zip），
# 直接发正式 Release。上游的浏览器回归测试驱动的是原项目界面，接入页会挡住它，这里不跑。
on:
  push:
    tags: ["v*-zs.*"]

permissions:
  contents: read

concurrency:
  group: zhishu-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm test
      - run: npm run typecheck
      - name: Check tag matches package version
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) process.exit(1)"

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
            flags: --win zip --x64
          - os: macos-15
            platform: macos
            arch: arm64
            flags: --mac zip --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: file:./build.db
      APP_SECRET: isolated-release-build-secret
      STORAGE_ROOT: ./build-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:migrate
      - run: npm run check:agent-driver
      - run: npm run build:desktop
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npx --no-install electron-builder ${{ matrix.flags }} --publish never
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          sudo sysctl -w kern.maxfiles=262144 kern.maxfilesperproc=131072
          ulimit -n 65536
          npx --no-install electron-builder ${{ matrix.flags }} --publish never
      - run: npm run smoke:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist-desktop/KTu-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Verify assets and create checksums
        run: |
          version="$(node -p "require('./package.json').version")"
          for platform in windows-x64 macos-arm64; do
            test -s "release/KTu-${version}-${platform}.zip"
          done
          cd release
          sha256sum KTu-*.zip | tee SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "K图 $GITHUB_REF_NAME" \
            --notes-file ".release/notes/$GITHUB_REF_NAME.md"
